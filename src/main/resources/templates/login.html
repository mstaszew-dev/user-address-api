<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - UserAddress API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md mx-4">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-cyan-400">UserAddress API</h1>
            <p class="text-sm text-slate-400 mt-1">Sign in to the dashboard</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 space-y-4">
            <div id="error-box" class="hidden bg-red-500/15 border border-red-500/30 text-red-400 text-sm rounded-lg px-3 py-2"></div>

            <div>
                <label class="block text-sm text-slate-400 mb-1" for="email">Email</label>
                <input id="email" type="email" placeholder="you@example.com"
                       class="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-100 focus:border-cyan-500 outline-none">
            </div>

            <div>
                <label class="block text-sm text-slate-400 mb-1" for="password">Password</label>
                <input id="password" type="password" placeholder="••••••••"
                       class="w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-100 focus:border-cyan-500 outline-none">
            </div>

            <button onclick="doLogin()"
                    class="w-full bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg px-4 py-2 text-sm font-medium transition-colors">
                Sign in
            </button>
        </div>

        <div class="mt-4 bg-slate-950/60 border border-slate-800 rounded-lg px-4 py-3 text-xs text-slate-400">
            <span class="text-slate-500">Demo credentials:</span> admin@example.com / admin123
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
