<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - UserAddress API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen">
    <nav class="bg-slate-900/80 border-b border-slate-800 backdrop-blur">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-6">
                    <a href="/dashboard" class="text-lg font-bold text-cyan-400">UserAddress API</a>
                    <div class="hidden sm:flex space-x-4">
                        <a href="/dashboard" class="text-sm text-cyan-400">Dashboard</a>
                        <a href="/users" class="text-sm text-slate-300 hover:text-cyan-400">Users</a>
                        <a href="/about" class="text-sm text-slate-300 hover:text-cyan-400">About</a>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="text-sm text-slate-400" id="nav-user-name"></span>
                    <button onclick="logout()"
                            class="text-sm px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 hover:border-slate-500 hover:text-white">Sign out</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <h1 class="text-2xl font-bold text-slate-100 mb-6">Dashboard</h1>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-slate-400">Total Users</p>
                        <p id="total-users" class="text-3xl font-bold text-slate-100 mt-1">-</p>
                    </div>
                    <span class="px-2.5 py-1 text-xs font-medium text-emerald-400 bg-emerald-500/15 border border-emerald-500/30 rounded-full">Live</span>
                </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-slate-400">Total Addresses</p>
                        <p id="total-addresses" class="text-3xl font-bold text-slate-100 mt-1">-</p>
                    </div>
                    <span class="px-2.5 py-1 text-xs font-medium text-emerald-400 bg-emerald-500/15 border border-emerald-500/30 rounded-full">Live</span>
                </div>
            </div>
        </div>

        <div id="error-box" class="hidden bg-red-500/15 border border-red-500/30 text-red-400 text-sm rounded-lg px-3 py-2 mb-4"></div>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
